name: Release

# Creates a GitHub Release automatically whenever a version tag is created — via
# `git push --tags` or the GitHub UI. Re-run for an existing tag with "Run workflow".
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and publish, e.g. v1.0.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build & publish GitHub Release
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Verify tag matches version
        run: node scripts/check-sources.mjs --tag "$TAG"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npx vitest run

      - name: Build
        run: node scripts/build.mjs --quiet

      - name: Package
        run: node scripts/package.mjs

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Figma2AE ${{ env.TAG }}
          draft: false
          prerelease: ${{ contains(env.TAG, '-') }}
          make_latest: ${{ !contains(env.TAG, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/release/Figma2AE-figma-plugin.zip
            dist/release/Figma2AE-ae-extension.zip
            dist/release/SHA256SUMS.txt
          body: |
            ## Install

            Full guide: https://jayprio.github.io/figma2ae/docs.html

            **After Effects 2023+ (macOS)** — unzip `Figma2AE-ae-extension.zip`, run `sh install.sh`,
            restart After Effects, open *Window ▸ Extensions ▸ Figma2AE*.

            **Figma (desktop app)** — unzip `Figma2AE-figma-plugin.zip` somewhere permanent, then
            *Plugins ▸ Development ▸ Import plugin from manifest…* → `figma-plugin/manifest.json`.

            Verify downloads with `shasum -a 256 -c SHA256SUMS.txt`.
